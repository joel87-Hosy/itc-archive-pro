services:
  - type: web
    name: itc-archive-pro-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://joel87-hosy.github.io
    healthCheckPath: /
